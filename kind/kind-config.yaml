kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-resilience
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Ingress NGINX (HTTP) -> http://localhost:8080
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      # Service NodePort -> http://localhost:30080
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
